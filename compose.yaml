services:
  tracksem:
    build:
      context: .
      args:
        TRACKSEM_BASE_PATH: "${TRACKSEM_BASE_PATH:-}"
    image: tracksem:local
    container_name: tracksem
    restart: unless-stopped
    ports:
      - "${TRACKSEM_BIND_IP:-127.0.0.1}:${TRACKSEM_PORT:-3173}:3000"
    environment:
      ORIGIN: "${TRACKSEM_ORIGIN:-http://localhost:3173}"
      TRACKSEM_DB_PATH: /app/data/tracksem.db
      # Hosts accepted besides ORIGIN's hostname and localhost (DNS-rebinding guard);
      # "tracksem" lets containers on tracksem_default (Glance's health check) reach it
      TRACKSEM_ALLOWED_HOSTS: "${TRACKSEM_BIND_IP:-127.0.0.1},tracksem"
      # Client IP for rate limits, when a proxy sets it (empty = use the socket address)
      ADDRESS_HEADER: "${TRACKSEM_ADDRESS_HEADER:-}"
      XFF_DEPTH: "${TRACKSEM_XFF_DEPTH:-1}"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
